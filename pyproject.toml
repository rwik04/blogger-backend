[project]
name = "blogger-backend"
version = "0.1.0"
description = "Presswork CMS backend"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
research = "agents.researcher.__main__:main"
strategize = "agents.strategist.__main__:main"
write = "agents.writer.__main__:main"
finish = "agents.finisher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm", "src/db", "src/graph", "src/agents", "src/mcpclient"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
